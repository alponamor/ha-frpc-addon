name: "BalealHome FRP Client"
description: "FRP client (frpc 0.70.1, TOML) exposing Home Assistant via the BalealHome FRP server."
version: "1.0.0"
slug: "frp_client_bh"
init: false
network: host
startup: services
privileged:
  - NET_ADMIN
devices:
  - /dev/net/tun
host_network: true
schema:
  serverip: str
  serverport: int
  token: str
  haport: int
  remoteport: int
  encryption: bool
  compression: bool
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
