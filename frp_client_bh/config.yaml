name: "BalealHome FRP Client"
description: "FRP client (frpc 0.70.1, TOML) exposing Home Assistant via the BalealHome FRP server. Auto-detects the HA web port (HA 2026.8+ portless installs supported)."
version: "1.3.0"
slug: "frp_client_bh"
init: false
network: host
startup: services
# Supervisor API access: run.sh reads the current Home Assistant web port
# via bashio::core.port (Supervisor /core/info) when haport = 0 (auto).
hassio_api: true
host_network: true
options:
  serverip: "217.28.140.223"
  serverport: 7000
  token: "REPLACE_WITH_FRPS_TOKEN"
  # 0 = auto-detect the HA port from the Supervisor API (recommended).
  # Set a positive value only to override (e.g. 8123 on a legacy setup).
  haport: 0
  remoteport: 8123
  # Pre-opened work connections (frp transport.poolCount, frps caps at 50). 20 avoids
  # "work connection pool is full, discarding" on dashboard bursts. v1.3.0.
  poolcount: 20
  encryption: true
  compression: true
schema:
  serverip: str
  serverport: int
  token: password
  haport: int
  remoteport: int
  poolcount: "int(0,50)?"
  encryption: bool
  compression: bool
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
